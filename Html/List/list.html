<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <!-- ordered data--> 
     <h3>Ordered list</h3>
     <ol type="a" start="" reversed>
        <li >html</li>
        <li>css</li>
        <li>js</li>
     </ol>

     <br>
     <h3>Unorderd list</h3>
     <!-- unordered list -->
     <ul >
        <li type ="square">html</li>
        <li type="disk">css</li>
        <li type="circle">java</li>
     </ul>

     <!-- Description list-->

     <dl >
        <dt>HTML</dt>
        <dd>Hyper text markup language</dd>
        <dd>Hyper text markup language</dd>
        <dt>css</dt>
        <dd>Cascading style sheet</dd>
        <dt>JS</dt>
        <dd>Java Script</dd>
     </dl>
</body>
</html>
