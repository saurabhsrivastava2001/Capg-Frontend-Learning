<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <fieldset style="background-color: rgb(61, 179, 179);">
        <legend> <mark>Job Application</mark> </legend>
    
    <form action="" method="post">
        <label for="name" >Name</label>
        <input type="text" id="name" name="username" required>
        
        <br><br>
        
        <label for="email">Email</label>
        <input type="email" id="email" name="email">
        <br><br>

        <label for="num">Contact no</label>
        <input type="tel" id="num" maxlength="10" minlength="10">

        <br><br>
        <label for="">Gender</label> <br>
        <label for="male">Male</label>
        <input type="radio" name="gender" id="male" checked>
        <label for="female">Female</label>
        <input type="radio" name="gender" id="female">

        <br><br>

        <label for="">Skills</label> <br>
        <label for="">HTML</label>
        <input type="checkbox" id="html" checked>
        <label for="css">CSS</label>
        <input type="checkbox" id="css" checked>
        <label for="js">JS</label>
        <input type="checkbox" id="js">

        <br><br>
        <label for="resume">Upload Resume</label>
        <input type="file" accept=".pdf, .docx">
            <br><br>
        <label for="doj">DOJ</label>
        <input type="date" min="2026-04-0" max="2026-04-15">
         <br><br>

         <label for="">Branch</label>
            <select name="branch" id="branch">
                <option value="">Select Branch</option>
                <option value="cse">CSE</option>
                <option value="ece">ECE</option>
                <option value="mech">MECH</option>
            </select>

            <br>
            <br>

            <label for="department">Department</label>
            <select name="department" id="department">
                <optgroup label="Engineering">
                    <option value="">CSE</option>
                    <option value="">ECE</option>
                    <option value="">MECH</option>
                </optgroup>
                <optgroup label="Management">
                    <option value="">MBA</option>
                    <option value="">BBA</option>
                    <option value="">Accounting</option>
                </optgroup>
            </select>
            <br><br>

            <details open>
                <summary>
                    Upcoming drive details
                </summary>
                <p>Details about the upcoming drive will be listed here.</p>
                </P>
            </details>

            <br><br>
            <label for="experience">Experience</label>
            
            <input type="range" name="" id="experience" step="20">
            <br><br>

            <input type="color">
            <br><br>
            Timeslot <input type="time"> 
            <br><br>
            <input type="submit" value="login">
            <br><br>
            <input type="reset" value="reset all data">
            <br><br>
            
            <label for="address"></label>
           <textarea name="" id="address" placeholder="address"></textarea>
           <br><br>


           <label for="fee">Fees:</label>
           <input type="text" value=200000 readonly>

            <button type="submit" "> Submit</button>


        
    </form>
</fieldset>
</body>
</html>
