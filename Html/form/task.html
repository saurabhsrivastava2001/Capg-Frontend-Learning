<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        input,option,select{
            background-color: rgb(211, 169, 123);
            color: aliceblue;
        }
    </style>
    <title>Registration Form</title>
</head>
<body>
    <fieldset style="background-color: antiquewhite;">
        <legend> <mark style="background-color: rgb(240, 228, 168);">Registration form</mark> </legend>
    <form action="">
        <table>
            <tr>
                <td><label for="name"><b>Name*</b></label></td>
                <td><input type="text" id="name" name="name" required></td>
            </tr>
            <tr>
                <td><label for="address"><b>Address</b></label></td>
                <td><input type="text" id="address" name="address"></td>
            </tr>
            <tr>
                <td><label for="zip"><b>Zip Code*</b></label></td>
                <td><input type="text" id="zip" name="zip" placeholder="enter a 5-digit code" maxlength="5" required></td>
            </tr>
            <tr>
                <td><label for="country"><b>Country*</b></label></td>
                <td>
                    <select name="country" id="country" required>
                        <option value="">Please select...</option>
                        <option value="ind">India</option>
                        <option value="pak">Pakistan</option>
                        <option value="aus">Australia</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label><b>Gender*</b></label></td>
                <td>
                    <input type="radio" name="gender" id="male" value="male" required>
                    <label for="male">Male</label>
                    <input type="radio" name="gender" id="female" value="female">
                    <label for="female">Female</label>
                </td>
            </tr>
            <tr>
                <td><label><b>Preferences*</b></label></td>
                <td>
                    <input type="checkbox" id="red" name="preferences" value="red">
                    <label for="red">Red</label>
                    <input type="checkbox" id="green" name="preferences" value="green" checked>
                    <label for="green">Green</label>
                    <input type="checkbox" id="blue" name="preferences" value="blue">
                    <label for="blue">Blue</label>
                </td>
            </tr>
            <tr>
                <td><label for="phone"><b>Phone*</b></label></td>
                <td><input type="tel" id="phone" name="phone" maxlength="10" minlength="10" required></td>
            </tr>
            <tr>
                <td><label for="email"><b>Email*</b></label></td>
                <td><input type="email" id="email" name="email" required></td>
            </tr>
            <tr>
                <td><label for="password"><b>Password*</b></label></td>
                <td><input type="password" id="password" name="password" placeholder="6-8 characters" minlength="6" maxlength="8" required></td>
            </tr>
            <tr>
                <td><label for="verify-password"><b>Verify Password*</b></label></td>
                <td><input type="password" id="verify-password" name="verify-password" required></td>
            </tr>
            <tr>
                <td><label for="birthday"><b>Birthday*</b></label></td>
                <td><input type="date" id="birthday" name="birthday" required></td>
            </tr>
            <tr>
                <td><label for="appointment"><b>Appointment*</b></label></td>
                <td><input type="time" id="appointment" name="appointment" required></td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="submit" value="SEND">
                    <input type="reset" value="CLEAR">
                </td>
            </tr>
        </table>
    </form>
    </fieldset>
</body>
</html>
